<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ezzy Madrasa · Fee Status &amp; Hall Ticket Portal</title>
  <meta name="description" content="Ezzy Madrasa, Burhani Park, Neral. Check fee status and download your hall ticket.">
  <meta name="theme-color" content="#0d7a6f">
  <link rel="icon" href="https://drive.google.com/thumbnail?id=11TTDvVd_Co3ISHFmaCRpfhdyJniYSOFF&sz=w128">
  <style>
    html, body { margin: 0; height: 100%; background: #f3f4f6; }
    /* The Apps Script app fills the whole window. Embedding it in this page
       is what hides Google's "created by a Google Apps Script user" banner. */
    #app {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: 0; display: block;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #0d7a6f;
      background: #f3f4f6; transition: opacity .3s;
    }
    #loading img { width: 96px; height: 96px; object-fit: contain; }
    #loading .spin {
      width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid #cfe7e3; border-top-color: #0d7a6f;
      animation: spin 0.9s linear infinite;
    }
    #loading a { color: #0d7a6f; font-size: .9rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="https://drive.google.com/thumbnail?id=11TTDvVd_Co3ISHFmaCRpfhdyJniYSOFF&sz=w300" alt="Ezzy Madrasa logo">
    <div class="spin" aria-hidden="true"></div>
    <div>Loading Ezzy Madrasa portal…</div>
    <a id="fallback" href="#">Not loading? Open the portal directly</a>
  </div>

  <iframe id="app" title="Ezzy Madrasa Fee Status &amp; Hall Ticket Portal"
          allow="clipboard-write"></iframe>

  <script>
    // Your Apps Script web app link (Deploy > Manage deployments > Web app URL, ends in /exec).
    var PORTAL_URL = 'https://script.google.com/macros/s/AKfycbzXEMKpLN4kBbeRY6HkBS9npa7UCQQbPAnZoEX7lAKfaB89-pGszBdJKBjN5Qtbzgg/exec';

    var frame = document.getElementById('app');
    var loading = document.getElementById('loading');
    document.getElementById('fallback').href = PORTAL_URL;

    // Safari (all iPhone/iPad browsers, including WhatsApp's) and Android
    // in-app WebViews block the cookies Google needs inside an embedded frame,
    // which shows "401. That's an error." On those, open the portal directly.
    var ua = navigator.userAgent;
    var isIOS = /iPhone|iPad|iPod/.test(ua) ||
      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isSafari = /Safari/.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|Firefox|FxiOS/.test(ua);
    var isWebView = /; wv\)|FBAN|FBAV|Instagram|WhatsApp/.test(ua);

    if (isIOS || isSafari || isWebView) {
      location.replace(PORTAL_URL);
    } else {
      frame.addEventListener('load', function () { loading.classList.add('gone'); });
      frame.src = PORTAL_URL;
    }
  </script>
</body>
</html>
